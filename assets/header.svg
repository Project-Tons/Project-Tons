<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Jiro - C#, .NET and WPF developer">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1d"/><stop offset="1" stop-color="#0e0b22"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0078D6"/><stop offset=".55" stop-color="#512BD4"/><stop offset="1" stop-color="#c026d3"/></linearGradient>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<clipPath id="card"><rect width="1000" height="280" rx="18"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:'Cascadia Code','Cascadia Mono',Consolas,'SF Mono',Menlo,monospace}
.in{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.glow{animation:glow 7s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.35}to{opacity:.6}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#card)">
<rect width="1000" height="280" fill="url(#bg)"/>
<rect width="1000" height="280" fill="url(#grid)"/>
<circle class="glow" cx="790" cy="70" r="150" fill="#512BD4" filter="url(#blur)"/>
<circle class="glow" cx="930" cy="250" r="120" fill="#0078D6" filter="url(#blur)"/>
</g>
<rect x=".5" y=".5" width="999" height="279" rx="18" fill="none" stroke="#fff" stroke-opacity=".09"/>

<g class="in d1"><text class="mono" x="64" y="76" font-size="15" letter-spacing="2" fill="#38bdf8">// WINDOWS DESKTOP DEVELOPER<tspan class="blink">_</tspan></text></g>
<g class="in d2"><text x="62" y="164" font-size="92" font-weight="800" fill="#fff" letter-spacing="-2">Jiro</text>
<rect x="66" y="180" width="64" height="5" rx="2.5" fill="url(#ac)"/></g>
<g class="in d3"><text x="64" y="224" font-size="26" font-weight="600" fill="#e2e8f0">C#  <tspan fill="#475569">·</tspan>  .NET  <tspan fill="#475569">·</tspan>  WPF</text></g>
<g class="in d4"><text x="64" y="254" font-size="16.5" fill="#8b9bb0">I turn plain Windows desktops into fluid, modern experiences.</text></g>

<g transform="translate(630 46)"><g class="float">
<rect x="0" y="0" width="330" height="178" rx="12" fill="#0f172a" fill-opacity=".8" stroke="#fff" stroke-opacity=".16"/>
<text x="16" y="24" font-size="12.5" fill="#94a3b8">WallpaperTONS</text>
<path d="M262 19h10" stroke="#94a3b8" stroke-width="1.4"/>
<rect x="288" y="14" width="10" height="10" rx="1.5" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
<path d="M312 14l10 10M322 14l-10 10" stroke="#94a3b8" stroke-width="1.4"/>
<rect x="10" y="38" width="310" height="130" rx="8" fill="url(#wall)"/>
<circle cx="240" cy="78" r="46" fill="#fff" fill-opacity=".10"/>
<circle cx="90" cy="110" r="62" fill="#fff" fill-opacity=".07"/>
<path d="M10 118 C 80 96, 150 140, 230 112 S 300 100, 320 108 V150 H10Z" fill="#fff" fill-opacity=".10"/>
<path d="M10 140h310v20a8 8 0 0 1 -8 8h-294a8 8 0 0 1 -8 -8z" fill="#fff" fill-opacity=".2"/>
<g fill="#fff"><rect x="118" y="147" width="14" height="14" rx="4" fill-opacity=".9"/><rect x="141" y="147" width="14" height="14" rx="4" fill-opacity=".55"/><rect x="164" y="147" width="14" height="14" rx="4" fill-opacity=".55"/><rect x="187" y="147" width="14" height="14" rx="4" fill-opacity=".55"/></g>
</g></g>
</svg>