<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.5" stop-color="#1a1147"/>
      <stop offset="1" stop-color="#0a2a5e"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="20s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c6ff"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ff6ec7"/>
      <animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="300" rx="20" fill="url(#bg)"/>
  <!-- floating orbs -->
  <circle cx="120" cy="80" r="60" fill="#512BD4" opacity=".25"><animate attributeName="cy" values="80;130;80" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="880" cy="220" r="80" fill="#0078D6" opacity=".25"><animate attributeName="cy" values="220;160;220" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="520" cy="270" r="40" fill="#ff6ec7" opacity=".2"><animate attributeName="cx" values="520;640;520" dur="8s" repeatCount="indefinite"/></circle>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="80" cy="40" r="2"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="260" r="2"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="40" r="2"><animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="90" r="2"><animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>
  <!-- WPF window mockup -->
  <g transform="translate(600,50)">
    <animateTransform attributeName="transform" type="translate" values="600,50;600,38;600,50" dur="5s" repeatCount="indefinite"/>
    <rect width="340" height="200" rx="12" fill="#0f1535" stroke="#00c6ff" stroke-opacity=".6" filter="url(#glow)"/>
    <rect width="340" height="30" rx="12" fill="#1c2352"/>
    <circle cx="20" cy="15" r="5" fill="#ff5f57"/><circle cx="38" cy="15" r="5" fill="#febc2e"/><circle cx="56" cy="15" r="5" fill="#28c840"/>
    <text x="170" y="20" fill="#8aa4ff" font-family="Consolas,monospace" font-size="11" text-anchor="middle">MainWindow.xaml</text>
    <g font-family="Consolas,monospace" font-size="13">
      <text x="18" y="62" fill="#ff7b72">&lt;Window</text>
      <text x="34" y="84" fill="#79c0ff">Title<tspan fill="#c9d1d9">=</tspan><tspan fill="#a5d6ff">"Jiro Studio"</tspan></text>
      <text x="34" y="106" fill="#79c0ff">Style<tspan fill="#c9d1d9">=</tspan><tspan fill="#a5d6ff">"{StaticResource Fluent}"</tspan><tspan fill="#ff7b72">&gt;</tspan></text>
      <text x="18" y="132" fill="#d2a8ff">  &lt;ViewModel/&gt;</text>
      <text x="18" y="154" fill="#7ee787">  // MVVM + Async ✔</text>
      <text x="18" y="180" fill="#ff7b72">&lt;/Window&gt;<tspan fill="#00c6ff">▌<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
    </g>
  </g>
  <!-- title -->
  <text x="50" y="120" font-family="Segoe UI,Arial,sans-serif" font-size="64" font-weight="800" fill="url(#txt)" filter="url(#glow)">JIRO</text>
  <text x="50" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#cbd5ff">C# · .NET · WPF Developer</text>
  <text x="50" y="205" font-family="Consolas,monospace" font-size="16" fill="#7dd3fc">Crafting Windows apps that feel alive</text>
  <rect x="50" y="225" width="260" height="4" rx="2" fill="url(#txt)"><animate attributeName="width" values="40;260;40" dur="4s" repeatCount="indefinite"/></rect>
</svg>
